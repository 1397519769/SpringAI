spring:
  application:
    name: Spring-AI
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  ai:
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: sk-***
      chat:
        options:
          model: qwen3.5-plus
      embedding:
        options:
          model: text-embedding-v3
          dimensions: 1024

    vectorstore:
      redis:
        initialize-schema: true
        index-name: pdf-documents-index
        prefix: "pdf_embedding:"
        distance-metric: COSINE
        vector-algorithm: HNSW

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/***?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: ***

  data:
    redis:
      host: localhost
      port: 6379

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.example.springai.entity.po
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    org.springframework.ai: debug
    com.example.springai: debug
    com.example.springai.mapper: debug

